server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/v1/transactions/**, /api/v1/accounts/**, /api/v1/customers/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
