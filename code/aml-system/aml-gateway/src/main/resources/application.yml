server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true
      routes:
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/v1/transactions/**, /api/v1/accounts/**, /api/v1/customers/**
      globalcors:
          add-to-simple-url-handler-mapping: true
          cors-configurations:
            '[/**]':
              allowedOriginPatterns:
                - "*"
              allowedMethods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
                - OPTIONS
              allowedHeaders:
                - "*"
              allowCredentials: true
              maxAge: 36000
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
