<div class="page-view">
  <div class="page-head">
    <div>
      <h1>Transaction monitoring</h1>
      <p>Live transactions supplied by the AML backend.</p>
    </div>
  </div>
  <p class="error-message" data-bind="visible: error, text: error"></p>
  <div class="panel table-panel">
    <table class="aegis-data-table">
      <thead>
        <tr>
          <th>Transaction ID</th>
          <th>Sender account</th>
          <th>Receiver account</th>
          <th>Date</th>
          <th>Amount</th>
          <th>Payment currency</th>
          <th>Received currency</th>
          <th>Payment type</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody data-bind="foreach: rows">
        <tr>
          <td data-bind="text: transactionId"></td>
          <td data-bind="text: senderAccountId"></td>
          <td data-bind="text: receiverAccountId"></td>
          <td data-bind="text: transactionDatetime"></td>
          <td data-bind="text: amount"></td>
          <td data-bind="text: paymentCurrency"></td>
          <td data-bind="text: receivedCurrency"></td>
          <td data-bind="text: paymentType"></td>
          <td data-bind="text: status"></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
