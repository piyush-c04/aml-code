<div class="page-view">
  <div class="page-head">
    <div>
      <h1>Customers</h1>
      <p>Live customer records from the AML backend.</p>
    </div>
  </div>
  <div class="panel search-panel">
    <oj-input-text
      label-hint="Search customers"
      value="{{search}}"
    ></oj-input-text>
  </div>
  <p class="error-message" data-bind="visible: error, text: error"></p>
  <div class="panel table-panel">
    <table class="aegis-data-table">
      <thead>
        <tr>
          <th>Customer ID</th>
          <th>Holder type</th>
          <th>KYC status</th>
          <th>Risk country</th>
          <th>Accounts</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody data-bind="foreach: filteredCustomers">
        <tr class="customer-row" data-bind="click: $parent.openCustomer">
          <td data-bind="text: id"></td>
          <td data-bind="text: accountHolderType"></td>
          <td data-bind="text: kycVerificationStatus"></td>
          <td data-bind="text: riskCountryFlag"></td>
          <td data-bind="text: accountCount"></td>
          <td data-bind="text: createdAt"></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
