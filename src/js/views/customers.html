<div class="page-view">
  <div class="page-head">
    <div>
      <h1>Customer risk &amp; AI assessment</h1>
      <p>Review customer behavior and explainable model outputs.</p>
    </div>
    <div class="page-actions"><oj-button chroming="outlined">Export CSV</oj-button><oj-button chroming="callToAction"
        on-oj-action="[[addCustomer]]">+ Add customer</oj-button></div>
  </div>
  <div class="panel search-panel">
    <oj-input-text label-hint="Search customers" value="{{search}}"></oj-input-text>
  </div>
  <div class="panel table-panel"><table class="aegis-data-table"><thead><tr><th>Customer</th><th>Risk score</th><th>Category</th><th>Accounts</th><th>Transactions</th><th>Alerts</th><th>Last assessment</th></tr></thead><tbody data-bind="foreach: filteredCustomers"><tr class="customer-row" data-bind="click: $parent.openCustomer"><td><div class="table-customer"><span class="table-avatar" data-bind="text: name.split(' ').map(function(part){ return part[0]; }).join('')"></span><span><b data-bind="text: name"></b><small data-bind="text: id"></small></span></div></td><td data-bind="text: score"></td><td><span class="risk-pill" data-bind="text: risk, css: risk.toLowerCase()"></span></td><td data-bind="text: accounts"></td><td data-bind="text: transactions"></td><td data-bind="text: alerts"></td><td data-bind="text: last"></td></tr></tbody></table></div>
</div>
